name: Release

# Builds installable Tauri artifacts for macOS (Apple Silicon + Intel),
# Windows, and Linux when you push a tag like `v0.1.0`, then attaches them
# to a GitHub draft release.
#
# To cut a release:
#   1. Bump version in `package.json`, `src-tauri/Cargo.toml`,
#      and `src-tauri/tauri.conf.json` (all three should match).
#   2. git tag v0.1.0 && git push origin v0.1.0
#   3. Wait for this workflow to finish, then publish the draft release on
#      the GitHub UI.
#
# The DMG / EXE / .deb / .AppImage / .app artifacts land in
# `src-tauri/target/<target>/release/bundle/*` inside each runner; the
# tauri-action step below uploads them automatically to the release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (e.g. v0.1.0). Required when running manually.
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ''
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # tauri-action handles the platform matrix nuances (target flags,
      # bundle types) and uploads the produced artifacts directly to the
      # draft release.
      #
      # IMPORTANT — code signing is intentionally disabled.
      #
      # When tauri-action sees APPLE_CERTIFICATE / APPLE_SIGNING_IDENTITY in
      # the environment, it runs `security import` to load the cert into a
      # temporary keychain. If those vars are present but EMPTY (which is
      # what `${{ secrets.X }}` resolves to when the secret is not set in
      # repo settings), `security import` fails with:
      #   SecKeychainItemImport: One or more parameters were not valid
      # and the entire macOS bundle step crashes. So we keep the env block
      # empty until real signing creds exist.
      #
      # When you get an Apple Developer ID and want to ship signed builds:
      #   1. Add APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
      #      APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD,
      #      APPLE_TEAM_ID as repo secrets in Settings → Secrets.
      #   2. Uncomment the lines below.
      #   3. Bump version, tag, push.
      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Auto-updater signing is intentionally disabled. When the env
          # vars TAURI_SIGNING_PRIVATE_KEY{,_PASSWORD} are present (even
          # if empty), tauri-action tries to sign update artifacts and
          # fails. They'll be re-enabled along with the updater plugin
          # in a future release — see docs/AUTO_UPDATE_SETUP.md.
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'ClaudeDeck ${{ github.event.inputs.tag || github.ref_name }}'
          releaseBody: |
            ## Downloads

            - **macOS (Apple Silicon)**: `*-aarch64.dmg`
            - **macOS (Intel)**: `*-x64.dmg`
            - **Windows**: `*-setup.exe` or `*.msi`
            - **Linux**: `*.AppImage` or `*.deb`

            > 💡 The macOS builds are not yet code-signed. On first launch you
            > may need to clear the quarantine attribute. See the README's
            > **Troubleshooting** section for the one-liner.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
