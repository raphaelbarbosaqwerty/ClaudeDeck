name: CI

# Lightweight checks on every push to main and on PRs. Runs the unit-test
# suites we have today (Rust + Vitest) plus svelte-check on three platforms,
# so we catch platform-specific regressions before they hit a release tag.
#
# Release artifacts are NOT built here — see release.yml. CI is meant to
# stay under ~5 minutes so it doesn't slow down PR review.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel duplicate runs on the same ref — saves CI minutes when several
# pushes land on a PR in quick succession.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: TypeScript / Svelte check
        run: pnpm check

      - name: Frontend unit tests
        run: pnpm test
